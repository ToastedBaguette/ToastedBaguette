name: Update Profile Activity

on:
  schedule:
    - cron: "30 22 * * *" # ~05:30 WIB daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update recent activity section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ToastedBaguette
        run: python3 scripts/update_activity.py

      - name: Commit and push
        run: |
          git config user.name "ToastedBaguette"
          git config user.email "ronyhartonoirawan@gmail.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: update recent activity [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
